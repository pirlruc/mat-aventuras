deviations:
  - id: KT-TEST-002
    why: >-
      KT-TEST-002 is per-module. :dominio (pure JVM) meets the org 95%
      statement and branch gates. :app and :dados are Android Compose/Room
      modules whose instrumentable lines require an emulator that Phase 1 CI
      does not boot, so a coverage ratio for those modules is undefined in
      this pipeline rather than lowered. MAT-002 adds instrumented coverage
      and is the review point to apply the numeric gate to :app and :dados.
    epic: MAT-001
