          goal: >-
            One simulation feeds both hosts, release bytecode is shrunk without
            breaking Godot, coverage exclusions shrink to JNI that cannot load
            in unit tests, SAST covers community Kotlin rules, names are
            bounded before Room and speech, and workflow lint matches CI-025.
        architecture:
