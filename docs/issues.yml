# Authored backlog for pirlruc/mat-aventuras.
#
# Schema: https://github.com/pirlruc/github-scaffold/blob/main/docs/issues-schema.md
# Methodology: https://github.com/pirlruc/methodologies/tree/1.9.2/github-issue-adr
#
# The Epic is the decision record — there are no ADR markdown files.
# Deviations from guardrails go in docs/guardrail-deviations.yml, not here.
#
# `id` values are permanent: issues are matched by the [ID] in their title.

milestones:
  - name: Phase 1 — Foundation
    status: done
    epics:
      - id: MAT-001
        status: done
        title: Native Compose host with isolated 2D/3D reward engines
        overview:
          problem: >-
            A kids' math app for ages 3 and 7 must mix Jetpack Compose learning
            UI with 2D and 3D reward games on mid-tier Android tablets, keep
            every profile/leaderboard/analytics record on-device, and speak
            Portuguese from Portugal, without embedding two commercial engines
            that fight for RAM after a Compose-to-game transition.
          goal: >-
            Ship a native Kotlin architecture where Compose owns menus,
            lessons, parental PIN, and rewards; a lightweight 2D engine and a
            process-isolated 3D engine handle reward levels; Room/DataStore are
            the only persistence; identifiers/docs are English; UI copy is
            pt-PT; and CI gates every included module against the pinned Kotlin
            guardrails (95% line and branch coverage; no coverage deviation).
        architecture:
          target: >-
            In the context of a native Android educational math game for ages
            3 and 7, facing Compose-to-engine RAM spikes on mid-tier tablets
            and a local-only privacy constraint, we decided to host all
            learning and dashboards in Jetpack Compose and run reward
            mini-games as dedicated Activities (Compose Canvas 2D in-process;
            GLES 3D in android:process :engine3d), rejecting Unity/Godot AAR
            embedding for v1, to achieve killable 3D heaps and 100% on-device
            data, accepting lower cinematic fidelity until a later Epic
            re-evaluates a single optional engine plugin.
          modules:
            - domain/
            - data/
            - app/
            - docs/architecture.md
        acceptance_criteria:
          - Age selection UI adapts tokens for 3-year-olds versus 7-year-olds
          - Parental dashboard is PIN-gated; PIN hash never stored in plaintext
          - Local leaderboard and badges persist in Room with no network calls
          - 3yo rewards launch the 2D engine; 7yo rewards launch the isolated 3D engine
          - App declares no INTERNET permission; user data never leaves the device
          - :domain, :data, and :app unit tests and coverage gates read kotlin/profile.thresholds.yml
          - Source identifiers, comments, KDoc, and docs are English; UI/TTS is pt-PT
        guardrail_refs:
          - KT-BUILD-001
          - KT-API-001
          - KT-API-004
          - KT-CONC-001
          - KT-TEST-001
          - KT-TEST-002
          - KT-CPLX-001
          - KT-SEC-001
          - KT-PERF-001
          - CI-001
          - CI-008
          - CI-022
          - SC-DEP-001
        tasks:
          - id: MAT-001-T1
            status: done
            title: Pin guardrails, scaffold, and authored backlog
            instructions:
              files:
                - docs/guardrails
                - .github/scaffold
                - docs/issues.yml
                - docs/guardrail-deviations.yml
                - .github/ISSUE_TEMPLATE
            verification:
              - git submodule status docs/guardrails reports a SHA
              - python3 .github/scaffold/scripts/issues-sync.py --yaml docs/issues.yml --validate-only
            guardrail_refs:
              - CI-008

          - id: MAT-001-T2
            status: done
            title: Domain models, math generators, PIN, rewards
            instructions:
              files:
                - domain/src/main/kotlin/pt/mataventuras/domain
                - domain/src/test/kotlin/pt/mataventuras/domain
            verification:
              - ./gradlew :domain:ktlintCheck :domain:detekt :domain:test :domain:koverVerify
            guardrail_refs:
              - KT-API-001
              - KT-TEST-001
              - KT-TEST-002
              - KT-CPLX-001

          - id: MAT-001-T3
            status: done
            title: Room persistence and local leaderboard
            instructions:
              files:
                - data/src/main/kotlin/pt/mataventuras/data
            verification:
              - Room schema matches docs/architecture.md
              - No Retrofit/Firebase/HTTP client in the graph
            guardrail_refs:
              - KT-API-001
              - KT-SEC-001

          - id: MAT-001-T4
            status: done
            title: Compose screens and isolated game Activities
            instructions:
              files:
                - app/src/main/kotlin/pt/mataventuras/app
                - app/src/main/AndroidManifest.xml
            verification:
              - AgeSelectionScreen, ParentDashboard, and LeaderboardAndRewardsScreen exist
              - Kart3dActivity uses android:process :engine3d
              - All user-visible strings are pt-PT; identifiers are English
            guardrail_refs:
              - KT-API-004
              - KT-PERF-001
              - KT-CONC-001

          - id: MAT-001-T5
            status: done
            title: Gradle CI reading pinned Kotlin thresholds
            instructions:
              files:
                - .github/workflows/ci.yml
                - scripts/verify-coverage.py
                - gradle/libs.versions.toml
            verification:
              - CI quality job pins actions by SHA
              - Coverage script fails closed when thresholds keys are missing
            guardrail_refs:
              - CI-001
              - CI-022
              - KT-BUILD-001
              - KT-TEST-002

          - id: MAT-001-T6
            status: done
            title: English identifiers and docs; pt-PT UI only
            instructions:
              files:
                - domain/
                - data/
                - app/
                - docs/architecture.md
                - README.md
            verification:
              - Gradle modules are :domain, :data, :app
              - VoiceScripts and strings.xml values remain pt-PT
              - python3 .github/scaffold/scripts/lint-doc-links.py --root .
            guardrail_refs:
              - KT-API-004

