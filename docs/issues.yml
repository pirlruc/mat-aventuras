              - Intent extras match EngineLauncher (mascot, name, finished)
              - Merged manifest still has no INTERNET permission
              - Domain OffroadRacerEngine and Platformer2dEngine remain the Robolectric fallback
              - org.godotengine:godot is pinned; Unity is not a dependency
            guardrail_refs:
              - KT-PERF-001
              - KT-SEC-001
