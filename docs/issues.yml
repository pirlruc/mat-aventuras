          - Public Kotlin types carry KDoc (KT-DOC-001; no invented coverage ratio)
          - Dependabot open-pull-requests-limit stays at the org default of 5
        guardrail_refs:
          - KT-BUILD-002
          - KT-CPLX-002
          - KT-DOC-001
          - KT-SEC-002
          - KT-SEC-003
          - KT-SEC-004
          - CI-004
          - CI-006
          - CI-009
          - CI-010
          - CI-011
          - CI-012
          - CI-023
          - CI-029
          - SC-LIC-001
          - SC-DEP-004
        tasks:
          - id: MAT-004-T1
            status: done
            title: Split CI jobs and add secret/SAST scans
            instructions:
