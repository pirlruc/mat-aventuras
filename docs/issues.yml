            Keep Godot in the isolated processes and Room in the Compose
            process. Do not add a network client. KT-TEST-002 floors stay at
            95. Exclusions beyond kotlinx.serialization are recorded on
            MAT-006. MAT-005-T3 still removes LessonScreenKt, NavGraphKt,
            NativeKartHost, and NativeRunnerHost. Do not add exclusions to
