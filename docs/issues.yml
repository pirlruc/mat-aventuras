            guardrail_refs:
              - KT-TEST-001

  - name: Phase 3 — Hardening and engines
    status: open
    epics:
      - id: MAT-003
        status: done
        title: Isolated Godot 4 reward engine
        overview:
          problem: >-
            v1 GLES/Canvas rewards are playable but not cinematic. Embedding
            Unity or Godot in the Compose process would revive the RAM spike
            MAT-001 rejected. Unity-as-a-library is a heavier, proprietary
            player that is harder to keep local-only.
          goal: >-
            Adopt Godot 4 (MIT, Maven Central AAR, gl_compatibility) as the
            single reward engine in android:process :engine3d and :engine2d,
            with native Canvas/GLES as the Robolectric fallback, no
            networking, analytics, or cloud save.
        architecture:
          target: >-
            In the context of isolated reward mini-games on mid-tier tablets,
            we decided to embed Godot 4 (not Unity) via org.godotengine:godot
            in KartPluginActivity (:engine3d) and RunnerPluginActivity
            (:engine2d), rejecting Unity-as-a-library for heap size, MIT
            licensing, and a strip-able INTERNET merge, accepting a
            Robolectric native fallback because libgodot_android cannot load
            in unit tests.
          modules:
            - app/src/main/kotlin/pt/mataventuras/plugin
            - app/src/main/kotlin/pt/mataventuras/app/engine
            - app/src/main/assets
            - docs/architecture.md
            - docs/engine-plugin.md
        acceptance_criteria:
          - Plugin Activity uses an isolated process
          - No INTERNET permission introduced by the plugin
          - Domain simulation APIs remain the fallback when Godot cannot embed
          - Godot 4 is the adopted engine; Unity is not shipped
        guardrail_refs:
          - KT-API-004
          - KT-PERF-001
          - KT-SEC-001
        tasks:
          - id: MAT-003-T1
            status: done
            title: Document plugin contract and reject in-process embedding
            instructions:
              files:
                - docs/architecture.md
                - app/src/main/kotlin/pt/mataventuras/app/engine/EngineLauncher.kt
            verification:
              - Architecture lists the Intent contract and process name
            guardrail_refs:
              - KT-API-004

          - id: MAT-003-T2
            status: done
            title: Native oval-track GLES kart in :engine3d
            instructions:
              files:
                - domain/src/main/kotlin/pt/mataventuras/domain/engine
                - app/src/main/kotlin/pt/mataventuras/app/engine/Kart3dActivity.kt
                - app/src/main/kotlin/pt/mataventuras/app/engine/KartRenderer.kt
            verification:
              - Kart3dEngine drives an oval track with steer, boost, and ring pickups
              - Kart3dActivity uses android:process :engine3d and does not open Room
              - HUD copy is pt-PT (Volta, Anéis, Impulso)
            guardrail_refs:
              - KT-PERF-001
              - KT-API-004

          - id: MAT-003-T4
            status: done
            title: Host resolver, isolated Activity base, optional AAR hook
            instructions:
              files:
                - domain/src/main/kotlin/pt/mataventuras/domain/engine/EnginePluginContract.kt
                - domain/src/main/kotlin/pt/mataventuras/domain/engine/EnginePluginResolver.kt
                - app/src/main/kotlin/pt/mataventuras/app/engine/IsolatedEngineActivity.kt
                - app/src/main/kotlin/pt/mataventuras/app/engine/EngineLauncher.kt
                - docs/engine-plugin.md
                - samples/engine-plugin
            verification:
              - EnginePluginResolver prefers plugin class names when present
              - EngineLauncher falls back to native Activities when they are absent
              - app/build.gradle.kts compiles libs/engine-plugin.aar when the file exists
              - IsolatedEngineActivity exposes extras and completeReward
            guardrail_refs:
              - KT-PERF-001
              - KT-API-004
              - KT-SEC-001

          - id: MAT-003-T3
            status: done
            title: Adopt Godot 4 in isolated processes
            instructions:
              files:
                - gradle/libs.versions.toml
                - app/src/main/kotlin/pt/mataventuras/plugin
                - app/src/main/kotlin/pt/mataventuras/app/engine
