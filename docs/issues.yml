      - id: MAT-005
        status: done
        title: Close review gaps without new coverage deviations
        overview:
          problem: >-
            Prize rules are implemented twice (Kotlin simulation and GDScript),
            release builds are not minified, :app Kover still omits Compose
            facades and the Godot JNI package, semgrep only runs the local
