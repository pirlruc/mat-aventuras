complexity:
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 10
    ignoreAnnotated: ['Composable']
  ComplexCondition:
    active: true
    allowedConditions: 4
  LongMethod:
    active: true
    allowedLines: 60
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    allowedFunctionParameters: 6
    allowedConstructorParameters: 8
  TooManyFunctions:
    active: true
    allowedFunctionsPerClass: 16
    # A rules object may hold the constants and a short table of delegates.
    allowedFunctionsPerObject: 90
    allowedFunctionsPerFile: 25

comments:
  UndocumentedPublicClass:
    active: true
    excludes: ["**/test/**"]
    searchInInnerObject: false
  UndocumentedPublicFunction:
    active: true
    excludes: ["**/test/**"]

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 3
