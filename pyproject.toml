[project]
name = "mat-aventuras"
version = "0.0.0"
description = "On-device Portuguese math game and its CI helpers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "types-pyyaml>=6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
exclude = ["\\.venv", "docs/guardrails", "\\.github/scaffold"]
