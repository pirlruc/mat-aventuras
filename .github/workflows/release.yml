# Builds a release APK, then publishes the GitHub Release for an annotated
# tag that already exists. common-release 5.7.0 attaches the APK and a
# .sha256. Signing secrets are optional; an empty keystore builds unsigned.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to release, for example 0.2.0
        required: true
        type: string

permissions: {}

jobs:
  apk:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-release-apk.yml@b56948f24666d00384bd516a2b3c4eb8eb6c5938
    with:
      scripts_ref: b56948f24666d00384bd516a2b3c4eb8eb6c5938
    secrets:
      checkout_token: ${{ github.token }}
      keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    needs: apk
    permissions:
      contents: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-release.yml@01d993bc72eebc8806ae85f9459c4f3d6dd3415e
    with:
      tag: ${{ inputs.tag }}
      release_artifact: android-release-apk
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
