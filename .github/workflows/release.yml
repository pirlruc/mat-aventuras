# Builds a release APK and its CycloneDX bill, then publishes the GitHub
# Release for an annotated tag that already exists. common-release v6.2.0
# attaches every file in the artifact, writes a .sha256 for each, and
# signs those blobs. android-release-apk 1.7.0 and common-release both
# select the release environment. The caller jobs cannot.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to release, for example 0.2.0
        required: true
        type: string

permissions: {}

jobs:
  apk:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-release-apk.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
      # 1.7.0 selects this environment inside the reusable workflow.
      # The caller job cannot. The keystore secrets live only there.
      environment: release
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
      keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    needs: apk
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/commondevops/.github/workflows/common-release.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      tag: ${{ inputs.tag }}
      release_artifact: android-release-apk
      sign: true
      environment: release
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
