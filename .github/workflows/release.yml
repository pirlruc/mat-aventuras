# Builds a release APK and its CycloneDX bill, then publishes the GitHub
# Release for an annotated tag that already exists. common-release 5.8.0
# attaches every file in the artifact, writes a .sha256 for each, and
# signs those blobs. The release job uses the release environment.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to release, for example 0.2.0
        required: true
        type: string

permissions: {}

jobs:
  apk:
    # The keystore secrets live in the tag-restricted release environment.
    # The job must run from the tag, or the environment rejects the deploy.
    environment: release
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-release-apk.yml@bca85a8216e4e94fde2f9b54ff8d65a87af07949
    with:
      scripts_ref: bca85a8216e4e94fde2f9b54ff8d65a87af07949
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
      keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    needs: apk
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/commondevops/.github/workflows/common-release.yml@cb34967f230a0d4841ae1efc2c98e745bd8726a7
    with:
      tag: ${{ inputs.tag }}
      release_artifact: android-release-apk
      sign: true
      environment: release
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
