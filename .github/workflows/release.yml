# Builds a release APK and its CycloneDX bill, then publishes the GitHub
# Release for an annotated tag that already exists. common-release-sign v6.11.0
# attaches every file in the artifact, writes a .sha256 for each, and
# signs those blobs. android-release-apk 1.12.0 and common-release-sign both
# select the release environment. The caller jobs cannot.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to release, for example 0.2.0
        required: true
        type: string

permissions: {}

jobs:
  apk:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-release-apk.yml@29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
    with:
      scripts_ref: 29b91430c9c55f84ad05575bd0b2267ed30096d2 # 1.12.0
      # 1.12.0 selects this environment inside the reusable workflow.
      # The caller job cannot. The keystore secrets live only there.
      environment: release
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
      keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    needs: apk
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/commondevops/.github/workflows/common-release-sign.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
    with:
      tag: ${{ inputs.tag }}
      release_artifact: android-release-apk
      sign: true
      environment: release
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
