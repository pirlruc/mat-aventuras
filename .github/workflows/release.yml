# Builds a release APK and its CycloneDX bill, then publishes the GitHub
# Release for an annotated tag that already exists. common-release 5.8.0
# attaches every file in the artifact, writes a .sha256 for each, and
# signs those blobs. android-release-apk 1.2.0 and common-release both
# select the release environment. The caller jobs cannot.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to release, for example 0.2.0
        required: true
        type: string

permissions: {}

jobs:
  apk:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-release-apk.yml@e88c3b8f3d8ad530ca3569059fc3c9f7f2ea2ad8
    with:
      scripts_ref: e88c3b8f3d8ad530ca3569059fc3c9f7f2ea2ad8
      # 1.2.0 selects this environment inside the reusable workflow.
      # The caller job cannot. The keystore secrets live only there.
      environment: release
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
      keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    needs: apk
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/commondevops/.github/workflows/common-release.yml@cb34967f230a0d4841ae1efc2c98e745bd8726a7
    with:
      tag: ${{ inputs.tag }}
      release_artifact: android-release-apk
      sign: true
      environment: release
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
