# Quality and Android builds. Heavy jobs skip a pull request that does not
# touch the app, the domain, Gradle, or scripts. The gate job still runs, so a
# docs-only pull request is not blocked on a skipped Gradle build.
# Android jobs call androiddevops 1.0.2 (CI-018).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.set.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: set
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          code=true
          if [[ "${EVENT}" == "pull_request" ]]; then
            code=false
            git fetch --depth=1 origin "${BASE}"
            pattern='^(app|data|domain|gradle|scripts)/|^(build|settings)\.gradle\.kts$|^gradle\.properties$|^libs/'
            if git diff --name-only "origin/${BASE}...HEAD" | grep -Eq "${pattern}"; then
              code=true
            fi
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"

  quality:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python tools
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --require-hashes -r requirements-ci.txt

      - name: Parse YAML and issue manifest
        run: |
          .ci-venv/bin/python scripts/validate-yaml.py \
            docs/issues.yml \
            docs/guardrail-deviations.yml \
            docs/issues-sync-targets.yml \
            docs/companion-pins.yml \
            .github/dependabot.yml \
            .github/workflows/ci.yml \
            .github/workflows/shared-ci.yml \
            .github/workflows/python-quality.yml \
            .github/workflows/emulator.yml \
            .github/workflows/release.yml
          .ci-venv/bin/python scripts/validate-issues.py docs/issues.yml
          .ci-venv/bin/python scripts/verify-companion-pins.py

      - name: Godot headless import
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/check-godot.sh

      - name: Public type KDoc (KT-DOC-001)
        run: python3 scripts/verify-kdoc.py

      - name: Privacy manifest (backup / isolation)
        run: .ci-venv/bin/python scripts/verify-privacy-manifest.py

      - name: License allow/deny (SC-LIC-001)
        run: python3 scripts/verify-licenses.py

  android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-gradle-ci.yml@6146c3b38d8915e92742a2a4eef6bd276047ac91
    with:
      scripts_ref: 6146c3b38d8915e92742a2a4eef6bd276047ac91
      gradle_tasks: >-
        :domain:ktlintCheck :domain:detekt :domain:test :domain:koverXmlReport :domain:koverVerify
        :data:ktlintCheck :data:detekt :data:testDebugUnitTest :data:koverXmlReportDebug :data:koverVerifyDebug
        :app:ktlintCheck :app:detekt :app:testDebugUnitTest :app:koverXmlReportDebug :app:koverVerifyDebug
        :app:lintDebug
      pre_command: bash scripts/checkout-guardrails.sh
      post_command: >-
        python3 -m venv .ci-venv &&
        .ci-venv/bin/pip install --require-hashes -r requirements-ci.txt &&
        .ci-venv/bin/python scripts/verify-coverage.py
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
      command_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  codeql:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/androiddevops/.github/workflows/android-codeql.yml@6146c3b38d8915e92742a2a4eef6bd276047ac91
    with:
      scripts_ref: 6146c3b38d8915e92742a2a4eef6bd276047ac91
      upload: never
      build_command: >-
        ./gradlew --no-daemon :domain:compileKotlin :data:compileDebugKotlin :app:compileDebugKotlin
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  mobsf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-mobsf.yml@6146c3b38d8915e92742a2a4eef6bd276047ac91
    with:
      scripts_ref: 6146c3b38d8915e92742a2a4eef6bd276047ac91
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-apk-sbom.yml@6146c3b38d8915e92742a2a4eef6bd276047ac91
    with:
      scripts_ref: 6146c3b38d8915e92742a2a4eef6bd276047ac91
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: false

  gate:
    if: always()
    needs: [changes, quality, android, codeql, mobsf, sbom, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = [
              name
              for name, info in needs.items()
              if info.get("result") not in ("success", "skipped")
          ]
          if bad:
              print("failed:", ", ".join(sorted(bad)))
              sys.exit(1)
          print("ok")
          PY
