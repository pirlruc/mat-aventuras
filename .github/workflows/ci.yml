# Quality, tests, docs, security (CI-006 / CI-009–012). Action pins are SHAs (CI-001).
# GUARDRAILS_READ_TOKEN inits docs/guardrails. Push to main fails closed without
# it. Other events skip and keep config/kotlin.thresholds.yml (CI-024).
# commondevops callers live in shared-ci.yml (COMMONDEVOPS_READ_TOKEN).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1,15 * *" # twice monthly; gap stays inside security_rescan_interval_days (CI-029)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guardrails submodule
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: bash scripts/checkout-guardrails.sh

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Python tools
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q pyyaml defusedxml

      - name: Parse YAML and issue manifest
        run: |
          .ci-venv/bin/python scripts/validate-yaml.py \
            docs/issues.yml \
            docs/guardrail-deviations.yml \
            docs/issues-sync-targets.yml \
            docs/companion-pins.yml \
            .github/dependabot.yml \
            .github/workflows/ci.yml \
            .github/workflows/hardening.yml \
            .github/workflows/codeql.yml \
            .github/workflows/shared-ci.yml \
            .github/workflows/python-quality.yml
          .ci-venv/bin/python scripts/validate-issues.py docs/issues.yml
          .ci-venv/bin/python scripts/verify-companion-pins.py

      - name: Domain static analysis
        run: |
          ./gradlew --no-daemon :domain:ktlintCheck :domain:detekt

      - name: Public type KDoc (KT-DOC-001)
        run: python3 scripts/verify-kdoc.py

      - name: Privacy manifest (backup / isolation)
        run: .ci-venv/bin/python scripts/verify-privacy-manifest.py

      - name: Shellcheck (CI-023)
        run: shellcheck scripts/*.sh

      - name: actionlint (CI-023)
        run: bash scripts/run-actionlint.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guardrails submodule
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: bash scripts/checkout-guardrails.sh

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Domain tests
        run: |
          ./gradlew --no-daemon :domain:test :domain:koverXmlReport :domain:koverVerify

      - name: Android unit tests, coverage, and lint (KT-TEST-002, KT-BUILD-002)
        run: |
          ./gradlew --no-daemon \
            :data:testDebugUnitTest :data:koverXmlReportDebug :data:koverVerifyDebug \
            :app:testDebugUnitTest :app:koverXmlReportDebug :app:koverVerifyDebug \
            :app:lintDebug

      - name: Coverage thresholds (CI-022)
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q pyyaml defusedxml
          .ci-venv/bin/python scripts/verify-coverage.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint relative markdown links
        run: python3 scripts/lint-doc-links.py --root .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret scan (gitleaks MIT binary, KT-SEC-003)
        run: |
          ver="8.24.3"
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --no-banner --exit-code 1

      - name: Dependency vulnerabilities (KT-SEC-004)
        run: bash scripts/run-grype.sh

      - name: SAST (local rules and p/kotlin, KT-SEC-002)
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q "setuptools>=70,<82" "semgrep==1.128.1"
          .ci-venv/bin/semgrep --config .semgrep.yml --error --quiet --metrics off
          .ci-venv/bin/semgrep --config p/kotlin --error --quiet --metrics off

      - name: License allow/deny (SC-LIC-001)
        run: python3 scripts/verify-licenses.py
