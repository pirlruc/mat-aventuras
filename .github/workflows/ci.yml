# Quality, wrapper validation, and dependency review. Gradle, CodeQL, MobSF,
# and the APK bill each have their own workflow. androiddevops 1.12.0 locks
# format(github.workflow, github.ref), so those callers cannot share a name.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

concurrency:
  group: ci-orchestrator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.set.outputs.code }}
      deps: ${{ steps.set.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: set
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          code=true
          deps=true
          if [[ "${EVENT}" == "pull_request" ]]; then
            code=false
            deps=false
            git fetch --depth=1 origin "${BASE}"
            names="$(git diff --name-only "origin/${BASE}...HEAD")"
            pattern='^(app|data|domain|gradle|scripts)/|^(build|settings)\.gradle\.kts$|^gradle\.properties$|^libs/'
            if grep -Eq "${pattern}" <<<"${names}"; then
              code=true
            fi
            if grep -Eq '^gradle/|libs\.versions\.toml' <<<"${names}"; then
              deps=true
            fi
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "deps=${deps}" >> "${GITHUB_OUTPUT}"

  quality:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python tools
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --require-hashes -r requirements-ci.txt

      - name: Issue manifest and companion pins
        run: |
          .ci-venv/bin/python scripts/validate-issues.py docs/issues.yml
          .ci-venv/bin/python scripts/verify-companion-pins.py

      - name: Godot headless import
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/check-godot.sh

      - name: Public type KDoc (KT-DOC-001)
        run: python3 scripts/verify-kdoc.py

      - name: Privacy manifest (backup / isolation)
        run: .ci-venv/bin/python scripts/verify-privacy-manifest.py

      - name: License allow/deny (SC-LIC-001)
        run: python3 scripts/verify-licenses.py

  wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: pirlruc/commondevops/.github/workflows/common-dependency-review.yml@9350e95cbb130219be113d8737469cd7c39f155c # v6.11.0
    with:
      fail_on_severity: high

  gate:
    if: always()
    needs: [changes, quality, dependency-review, wrapper]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = [
              name
              for name, info in needs.items()
              if info.get("result") not in ("success", "skipped")
          ]
          if bad:
              print("failed:", ", ".join(sorted(bad)))
              sys.exit(1)
          print("ok")
          PY
