# Quality and Android builds. Heavy jobs skip a pull request that does not
# touch the app, the domain, Gradle, or scripts. The gate job still runs, so a
# docs-only pull request is not blocked on a skipped Gradle build.
# Android jobs call androiddevops 1.7.0 (CI-018).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.set.outputs.code }}
      deps: ${{ steps.set.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: set
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          code=true
          deps=true
          if [[ "${EVENT}" == "pull_request" ]]; then
            code=false
            deps=false
            git fetch --depth=1 origin "${BASE}"
            names="$(git diff --name-only "origin/${BASE}...HEAD")"
            pattern='^(app|data|domain|gradle|scripts)/|^(build|settings)\.gradle\.kts$|^gradle\.properties$|^libs/'
            if grep -Eq "${pattern}" <<<"${names}"; then
              code=true
            fi
            if grep -Eq '^gradle/|libs\.versions\.toml' <<<"${names}"; then
              deps=true
            fi
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "deps=${deps}" >> "${GITHUB_OUTPUT}"

  quality:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python tools
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --require-hashes -r requirements-ci.txt

      - name: Issue manifest and companion pins
        run: |
          .ci-venv/bin/python scripts/validate-issues.py docs/issues.yml
          .ci-venv/bin/python scripts/verify-companion-pins.py

      - name: Godot headless import
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/check-godot.sh

      - name: Public type KDoc (KT-DOC-001)
        run: python3 scripts/verify-kdoc.py

      - name: Privacy manifest (backup / isolation)
        run: .ci-venv/bin/python scripts/verify-privacy-manifest.py

      - name: License allow/deny (SC-LIC-001)
        run: python3 scripts/verify-licenses.py

  android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-gradle-ci.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
      gradle_tasks: >-
        :domain:ktlintCheck :domain:detekt :domain:test :domain:koverXmlReport :domain:koverVerify
        :data:ktlintCheck :data:detekt :data:testDebugUnitTest :data:koverXmlReportDebug :data:koverVerifyDebug
        :app:ktlintCheck :app:detekt :app:testDebugUnitTest :app:koverXmlReportDebug :app:koverVerifyDebug
        :app:lintDebug
        cyclonedxBom
      pre_command: bash scripts/checkout-guardrails.sh
      post_command: >-
        python3 -m venv .ci-venv &&
        .ci-venv/bin/pip install --require-hashes -r requirements-ci.txt &&
        .ci-venv/bin/python scripts/verify-coverage.py &&
        python3 scripts/verify-licenses.py
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
      command_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  codeql:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      # The reusable upload job requests actions: read even when upload is never.
      actions: read
      security-events: write
    uses: pirlruc/androiddevops/.github/workflows/android-codeql.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
      upload: never
      build_command: >-
        ./gradlew --no-daemon :domain:compileKotlin :data:compileDebugKotlin :app:compileDebugKotlin
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  mobsf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-mobsf.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true'
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-apk-sbom.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}

  wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: pirlruc/commondevops/.github/workflows/common-dependency-review.yml@1e0c029bf93705f399f2a3a7e5f19810c101da65
    with:
      fail_on_severity: high

  gate:
    if: always()
    needs: [changes, quality, android, codeql, mobsf, sbom, dependency-review, wrapper]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = [
              name
              for name, info in needs.items()
              if info.get("result") not in ("success", "skipped")
          ]
          if bad:
              print("failed:", ", ".join(sorted(bad)))
              sys.exit(1)
          print("ok")
          PY
