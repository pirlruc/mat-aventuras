# Instrumented tests. Schedule and manual only, so pull requests do not
# spend the minutes. The runner is androiddevops 1.0.1.
name: emulator

on:
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  connected:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-emulator.yml@b56948f24666d00384bd516a2b3c4eb8eb6c5938
    with:
      scripts_ref: b56948f24666d00384bd516a2b3c4eb8eb6c5938
      api_level: "36"
      target: google_apis
      arch: x86_64
      script: ./gradlew --no-daemon :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
    secrets:
      checkout_token: ${{ github.token }}
