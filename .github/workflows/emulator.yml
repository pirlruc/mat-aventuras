# Instrumented tests. Schedule and manual only, so pull requests do not
# spend the minutes. The runner is androiddevops 1.1.0.
name: emulator

on:
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  connected:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-emulator.yml@bca85a8216e4e94fde2f9b54ff8d65a87af07949
    with:
      scripts_ref: bca85a8216e4e94fde2f9b54ff8d65a87af07949
      api_level: "36"
      target: google_apis
      arch: x86_64
      script: ./gradlew --no-daemon :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
