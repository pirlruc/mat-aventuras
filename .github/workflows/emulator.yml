# Instrumented tests. Schedule and manual only, so pull requests do not
# spend the minutes. The runner is androiddevops 1.4.0.
name: emulator

on:
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  connected:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-emulator.yml@4763e3be9f3a24a1b80dee3bf01530413aa3f49f
    with:
      scripts_ref: 4763e3be9f3a24a1b80dee3bf01530413aa3f49f
      api_level: "36"
      target: google_apis
      arch: x86_64
      script: ./gradlew --no-daemon :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
