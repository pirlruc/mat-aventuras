# Instrumented tests. Schedule and manual only, so pull requests do not
# spend the minutes. The runner is androiddevops 1.7.0.
name: emulator

on:
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  connected:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-emulator.yml@fb6651b3cd3246975df605e7000c4992d6b6a184
    with:
      scripts_ref: fb6651b3cd3246975df605e7000c4992d6b6a184
      api_level: "36"
      target: google_apis
      arch: x86_64
      script: ./gradlew --no-daemon :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
