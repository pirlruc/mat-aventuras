# Instrumented tests. Schedule and manual only, so pull requests do not
# spend the minutes. The runner is androiddevops 1.2.0.
name: emulator

on:
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  connected:
    permissions:
      contents: read
    uses: pirlruc/androiddevops/.github/workflows/android-emulator.yml@e88c3b8f3d8ad530ca3569059fc3c9f7f2ea2ad8
    with:
      scripts_ref: e88c3b8f3d8ad530ca3569059fc3c9f7f2ea2ad8
      api_level: "36"
      target: google_apis
      arch: x86_64
      script: ./gradlew --no-daemon :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
    secrets:
      checkout_token: ${{ secrets.GITHUB_TOKEN }}
