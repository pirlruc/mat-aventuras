# pydevops python-quality. Pin is the peeled commit of annotated tag 3.3.1
# (CI-018 / CI-034): uses: and devops_ref are the same SHA.
# The reusable workflow does not accept a checkout token. When pydevops is
# private again, this repository still needs Actions access so uses: can read
# the workflow file. Fork pull requests are skipped: they have no secret.
#
# 3.3.1 installs pytest with pytest-cov (PDO-TOOL-001 is fixed). This repo is
# not an installable package, so installable_app is false.
# The job stays skipped until PYTHON_QUALITY_ENABLED is true: the reusable
# workflow pulls ghcr.io/pirlruc/ci-lint and ci-python, and this repo's token
# gets "manifest unknown". There is no image override input.
name: python-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  python-quality:
    # Image pull fails for this repo. The variable is unset, so this stays skipped.
    if: >-
      vars.PYTHON_QUALITY_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
      actions: write
      packages: read
      security-events: write
      pull-requests: write
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@55f4e52faba65c8bd08623adcb22668860c04d14
    with:
      strictness_level: Medium
      docstring_format: Google
      enable_dast: false
      installable_app: false
      working_directory: .
      python_version: "3.13"
      devops_repository: pirlruc/pydevops
      devops_ref: 55f4e52faba65c8bd08623adcb22668860c04d14
      app_install_command: >-
        UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/mat-venv" uv sync --all-groups --all-extras
        && echo "${RUNNER_TEMP}/mat-venv/bin" >> "$GITHUB_PATH"
