# pydevops python-quality. Pin is the peeled commit of annotated tag 3.3.10
# (CI-018 / CI-034): uses: and devops_ref are the same SHA.
# The reusable workflow does not accept a checkout token. When pydevops is
# private again, this repository still needs Actions access so uses: can read
# the workflow file. Fork pull requests are skipped: they have no secret.
#
# 3.3.10 runs the quality report as a module so a green gate finishes the job. This repo is
# not an installable package, so installable_app is false.
# This repo has Actions read on ci-lint and ci-python, so the job runs.
# Fork pull requests are skipped.
name: python-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  python-quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      packages: read
      security-events: write
      pull-requests: write
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@7ebee303030c09ce8f52e99660691e4c4b41238f
    with:
      strictness_level: Medium
      docstring_format: Google
      enable_dast: false
      installable_app: false
      working_directory: .
      python_version: "3.13"
      devops_repository: pirlruc/pydevops
      devops_ref: 7ebee303030c09ce8f52e99660691e4c4b41238f
      app_install_command: >-
        UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/mat-venv" uv sync --all-groups --all-extras
        && echo "${RUNNER_TEMP}/mat-venv/bin" >> "$GITHUB_PATH"
