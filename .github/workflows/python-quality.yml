# pydevops python-quality. Pin is the peeled commit of annotated tag 3.10.1
# (CI-018 / CI-034): uses: and devops_ref are the same SHA.
# The reusable workflow does not accept a checkout token. When pydevops is
# private again, this repository still needs Actions access so uses: can read
# the workflow file. Fork pull requests are skipped: they have no secret.
#
# 3.10.1 runs the quality report as a module so a green gate finishes the job. This repo is
# not an installable package, so installable_app is false.
# This repo has Actions read on ci-lint and ci-python, so the job runs.
# Fork pull requests are skipped.
# A pull request or push runs the scan only when a Python file or a Python
# tool config changes. python-gate still runs, so a skipped scan does not
# leave a required check pending.
name: python-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.set.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Python changes
        id: set
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python=true
          names=""
          if [[ "${EVENT}" == "pull_request" ]]; then
            python=false
            git fetch --depth=1 origin "${BASE}"
            names="$(git diff --name-only "origin/${BASE}...HEAD")"
          elif [[ "${EVENT}" == "push" && "${BEFORE}" != 0000000000000000000000000000000000000000 ]]; then
            python=false
            names="$(git diff --name-only "${BEFORE}" HEAD)"
          fi
          if [[ "${python}" == "false" ]]; then
            pattern='(^|/)[^/]+\.py$|(^|/)pyproject\.toml$|(^|/)requirements[^/]*\.txt$|(^|/)uv\.lock$|^\.bandit$|^\.python-version$|(^|/)(ruff\.toml|\.ruff\.toml|mypy\.ini|\.mypy\.ini|pytest\.ini|tox\.ini)$|^\.github/workflows/python-quality\.yml$'
            if grep -Eq "${pattern}" <<<"${names}"; then
              python=true
            fi
          fi
          echo "python=${python}" >> "${GITHUB_OUTPUT}"

  python-quality:
    needs: changes
    if: needs.changes.outputs.python == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Union of the job permissions in pydevops python-quality 3.10.1.
    # contents: read checks out the repo. actions: write uploads artifacts.
    # pull-requests: write posts the quality summary. The reusable dropped
    # contents: write and security-events: write, so the caller does not grant them.
    permissions:
      contents: read
      actions: write
      packages: read
      pull-requests: write
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@1ebe447374d2fb655ee35eff578117be0c110865 # 3.10.1
    with:
      strictness_level: Medium
      docstring_format: Google
      enable_dast: false
      installable_app: false
      working_directory: .
      python_version: "3.13"
      devops_repository: pirlruc/pydevops
      devops_ref: 1ebe447374d2fb655ee35eff578117be0c110865 # 3.10.1
      app_install_command: >-
        UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/mat-venv" uv sync --all-groups --all-extras
        && echo "${RUNNER_TEMP}/mat-venv/bin" >> "$GITHUB_PATH"

  python-gate:
    needs: [changes, python-quality]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if Python quality failed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          changes = needs["changes"]["result"]
          quality = needs["python-quality"]["result"]
          if changes != "success" or quality not in ("success", "skipped"):
              print(f"changes={changes} python-quality={quality}")
              sys.exit(1)
          print(f"ok python-quality={quality}")
          PY
