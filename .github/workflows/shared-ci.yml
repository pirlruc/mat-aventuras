# commondevops reusable workflows. Pin is the peeled commit of annotated tag 5.7.0
# (CI-018 / CI-034): uses: and scripts_ref are the same SHA.
# ci-lint and ci-supply-chain are private. This repo has Actions read on both.
# install_runner_packages stays false.
# Token-free jobs stay in ci.yml so Dependabot (CI-024) is not all-skipped.
# Fork pull requests are skipped: they have no secret.
# Callers do not gate on github.actor (zizmor bot-conditions).
name: shared-ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

concurrency:
  group: shared-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  infra-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@01d993bc72eebc8806ae85f9459c4f3d6dd3415e
    with:
      blocking: true
      scripts_ref: 01d993bc72eebc8806ae85f9459c4f3d6dd3415e
      container_image: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111

  doc-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@01d993bc72eebc8806ae85f9459c4f3d6dd3415e
    with:
      blocking: true
      yaml_files: >-
        docs/issues.yml
        docs/guardrail-deviations.yml
        docs/issues-sync-targets.yml
        docs/companion-pins.yml
        .github/dependabot.yml
        .github/workflows/ci.yml
        .github/workflows/shared-ci.yml
        .github/workflows/python-quality.yml
        .github/workflows/emulator.yml
        .github/workflows/release.yml
      run_link_lint: true
      run_markdownlint: true
      scripts_ref: 01d993bc72eebc8806ae85f9459c4f3d6dd3415e

  scaffold-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@01d993bc72eebc8806ae85f9459c4f3d6dd3415e
    with:
      blocking: true
      scripts_ref: 01d993bc72eebc8806ae85f9459c4f3d6dd3415e

  secrets-sast:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@01d993bc72eebc8806ae85f9459c4f3d6dd3415e
    with:
      blocking: true
      semgrep_config: p/kotlin
      scripts_ref: 01d993bc72eebc8806ae85f9459c4f3d6dd3415e
      container_image: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111

  supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@01d993bc72eebc8806ae85f9459c4f3d6dd3415e
    with:
      blocking: true
      scripts_ref: 01d993bc72eebc8806ae85f9459c4f3d6dd3415e
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:7bbd542d5971594f6192da0ed0c49e29fc0c58328333d0920ab3143a2a0e04d3

  pins:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@01d993bc72eebc8806ae85f9459c4f3d6dd3415e
    with:
      pin_script: scripts/check-submodule-pins.sh
      scripts_ref: 01d993bc72eebc8806ae85f9459c4f3d6dd3415e

  scorecard:
    # Advisory. Publishing results does not change repository settings.
    # The reusable workflow skips forks. blocking stays false until a
    # scorecard run is green on this app.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@01d993bc72eebc8806ae85f9459c4f3d6dd3415e
    with:
      blocking: false
      publish_results: false
