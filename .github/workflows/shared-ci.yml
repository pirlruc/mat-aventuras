# commondevops reusable workflows. Pin is the peeled commit of annotated tag 5.6.2
# (CI-018 / CI-034): uses: and scripts_ref are the same SHA.
# commondevops is public, so these jobs use github.token. Passing
# COMMONDEVOPS_READ_TOKEN made the checkout ask for a username.
# ci-lint and ci-supply-chain are not visible to this repo (manifest unknown).
# Scanner jobs use a public Ubuntu image and install tools in the job.
# install_runner_packages stays false: true makes the docker credential
# expression an empty string, which Actions rejects.
# Token-free jobs stay in ci.yml so Dependabot (CI-024) is not all-skipped.
# Fork pull requests are skipped: they have no secret.
# Callers do not gate on github.actor (zizmor bot-conditions).
name: shared-ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

concurrency:
  group: shared-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  infra-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: true
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
      container_image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  doc-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: true
      yaml_files: >-
        docs/issues.yml
        docs/guardrail-deviations.yml
        docs/issues-sync-targets.yml
        docs/companion-pins.yml
        .github/dependabot.yml
        .github/workflows/ci.yml
        .github/workflows/hardening.yml
        .github/workflows/codeql.yml
        .github/workflows/shared-ci.yml
        .github/workflows/python-quality.yml
      run_link_lint: true
      run_markdownlint: true
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12

  scaffold-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: true
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12

  secrets-sast:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: true
      semgrep_config: p/kotlin
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
      container_image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: true
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
      container_image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  pins:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      pin_script: scripts/check-submodule-pins.sh
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12

  scorecard:
    # Advisory. Publishing results does not change repository settings.
    # The reusable workflow skips forks. blocking stays false until a
    # scorecard run is green on this app.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: false
      publish_results: false
