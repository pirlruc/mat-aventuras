# Dependabot (SC-DEP-001/002/003). Seeded from github-scaffold; this repo added Gradle.

version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: gradle
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
