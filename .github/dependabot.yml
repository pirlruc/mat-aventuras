# Dependabot (SC-DEP-001/002/003). Seeded from github-scaffold; this repo added Gradle.
#
# github-private uses the Dependabot secret DEPENDABOT_GITHUB_TOKEN
# (Settings → Secrets and variables → Dependabot, not Actions). It is attached
# to gitsubmodule, uv, and github-actions. Gradle and Docker stay on public
# registries.

registries:
  github-private:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.DEPENDABOT_GITHUB_TOKEN}}

version: 2

multi-ecosystem-groups:
  all-dependencies:
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    registries:
      - github-private
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: gradle
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    registries:
      - github-private
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /.devcontainer
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    # KT-BUILD-001: stay on an LTS JDK (17, 21, or 25). Ignore non-LTS tags only.
    ignore:
      - dependency-name: "eclipse-temurin"
        versions: ["22", "23", "24", "26"]

  # Submodule bumps stay out of the grouped PR (SC-DEP-004).
  - package-ecosystem: gitsubmodule
    directory: /
    registries:
      - github-private
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
