# Dependabot (SC-DEP-001/002/003). Seeded from github-scaffold; this repo added Gradle.

version: 2

multi-ecosystem-groups:
  all-dependencies:
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: gradle
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /.devcontainer
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
    # The Android jobs use Temurin 17. A major tag would leave that LTS.
    # Recorded as SC-DEP-003 in docs/guardrail-deviations.yml.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
