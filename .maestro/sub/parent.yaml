appId: pt.mataventuras.app
---
- tapOn:
    id: parent-open
- longPressOn:
    id: adult-hold
- copyTextFrom:
    id: adult-challenge
- evalScript: ${output.parts = maestro.copiedText.split(/[^0-9]+/).filter(function (part) { return part.length > 0; }); output.product = (Number(output.parts[0]) * Number(output.parts[1])).toString();}
- tapOn:
    id: pin-reset-answer
- inputText: ${output.product}
- hideKeyboard
- tapOn:
    id: adult-continue
- tapOn:
    id: parent-pin
- inputText: "1234"
- tapOn:
    id: parent-pin-confirm
- inputText: "1234"
- hideKeyboard
- tapOn:
    id: parent-pin-save
