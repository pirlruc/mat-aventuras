appId: pt.mataventuras.app
---
- launchApp:
    clearState: true
- tapOn: "6 a 8 anos"
- tapOn: "Como te chamas?"
- inputText: "Rui"
- hideKeyboard
- tapOn: "Vamos começar!"
- scrollUntilVisible:
    element: "Painel dos pais"
    direction: DOWN
- runFlow: sub/parent.yaml
- scrollUntilVisible:
    element: "English"
    direction: DOWN
- tapOn:
    id: lang-en
- extendedWaitUntil:
    visible: "Parent dashboard"
    timeout: 20000
- scrollUntilVisible:
    element: "Parent dashboard"
    direction: DOWN
- tapOn: "Parent dashboard"
- tapOn:
    id: parent-pin
- inputText: "1234"
- hideKeyboard
- tapOn:
    id: parent-pin-save
- scrollUntilVisible:
    element: "● English"
    direction: DOWN
    timeout: 20000
