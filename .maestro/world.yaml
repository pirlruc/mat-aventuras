appId: pt.mataventuras.app
---
- launchApp:
    clearState: true
- tapOn: "6 a 8 anos"
- tapOn: "Como te chamas?"
- inputText: "Rui"
- hideKeyboard
- tapOn: "Vamos começar!"
- scrollUntilVisible:
    element: "Painel dos pais"
    direction: DOWN
- runFlow: sub/parent.yaml
- scrollUntilVisible:
    element: "Noite"
    direction: DOWN
- tapOn: "Noite"
- extendedWaitUntil:
    visible: "● Noite"
    timeout: 10000
